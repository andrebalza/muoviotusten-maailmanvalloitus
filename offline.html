<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F3A47">
  <title>Muoviotukset – yhteys puuttuu</title>
  <style>
    :root{font-family:Montserrat,system-ui,sans-serif;color:#0f3a47;background:#f7f7f7}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem}
    main{width:min(100%,32rem);box-sizing:border-box;padding:2rem;border-radius:20px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.08)}
    h1{margin-top:0;font-size:clamp(1.8rem,8vw,2.7rem)}
    p{line-height:1.6}
    button{min-height:56px;width:100%;border:0;border-radius:16px;background:#1c8ca8;color:#fff;font:600 1rem inherit;padding:14px 20px;cursor:pointer}
    hr{border:0;border-top:1px solid #e6e6e6;margin:1.5rem 0}
  </style>
</head>
<body>
  <main>
    <h1>Verkkoyhteys puuttuu</h1>
    <p>Peli toimii verkossa. Tarkista yhteys ja yritä uudelleen. Pelin tila säilyy tällä laitteella.</p>
    <hr>
    <p><strong>No network connection</strong><br>The game works online. Check the connection and try again. Your game state remains on this device.</p>
    <button type="button" onclick="window.location.reload()">Yritä uudelleen / Try again</button>
  </main>
</body>
</html>
