server {
    listen 443 ssl http2;
    server_name otus.muoviamo.fi;
    root /var/www/otus.muoviamo.fi/htdocs;
    index index.php;

    location = /health {
        try_files /index.php =404;
    }

    location ~ ^/(bin|config|content|src|vendor)/ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location /print/qr/ {
        try_files $uri $uri/ =404;
    }

    location /gallery/ {
        # Piwigo is deployed inside the same WordOps site root at htdocs/gallery/.
        try_files $uri $uri/ /gallery/index.php?$args;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
